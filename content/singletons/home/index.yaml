pilares:
  - titulo: Desenvolvimento
    texto: >-
      Transformamos terrenos e áreas subutilizadas em empreendimentos comerciais rentáveis
      através de estudos de vocação, masterplan e análise de viabilidade técnica e financeira,
      análise de potenciais varejistas e ancoragem.
    icone: projetos
  - titulo: Incorporação
    texto: >-
      Conectamos terrenistas, investidores e lojistas através de modelos de parceria
      customizados, negociando e formalizando acordos que maximizam o retorno para todas as
      partes.
    icone: negocios
  - titulo: Gestão de Ativos
    texto: >-
      Gerenciamos desde o acompanhamento de obras até a comercialização completa das unidades,
      garantindo ocupação qualificada e performance sustentável. Atuamos na gestão completa do
      empreendimento após a conclusão das obras: carteira, fundo de promoção e condomínio, de
      ponta a ponta com os nossos parceiros.
    icone: operacao
empreendimentosDestaque:
  - piazza-nicomedes
  - villa-viseu
  - uberlandia-shopping
ctaTitulo: '*Terreno*, *investimento* ou *expansão*?'
ctaTexto: >-
  A Nexa trabalha com quem tem a área, com quem quer investir e com as marcas que procuram o
  próximo ponto. Agende uma conversa com o nosso time.
