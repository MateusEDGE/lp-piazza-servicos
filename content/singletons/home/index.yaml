headline: Transformamos áreas em ativos comerciais rentáveis.
subheadline: >-
  Especialistas no desenvolvimento de centros comerciais, strip malls e empreendimentos de
  conveniência, combinando inteligência de mercado, rigor jurídico e viabilidade financeira. Do
  estudo vocacional à gestão da operação.
etapasHero:
  - tag: Quem somos
    titulo: Inteligência de mercado em cada metro quadrado
    texto: >-
      Desenvolvemos espaços comerciais inteligentes e gerimos ativos com foco em performance,
      relacionamento e resultados sustentáveis.
  - tag: O que fazemos
    titulo: Conectamos marcas, ativos e experiências que geram valor.
    texto: >-
      Desenvolvimento, incorporação e gestão de ativos: um ciclo executado de ponta a ponta
      com os nossos parceiros.
