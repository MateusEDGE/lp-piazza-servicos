copy: >-
  O Piazza Nicomedes está em fase avançada de desenvolvimento e contará com mais de 30 operações
  comerciais estrategicamente distribuídas em um terreno de 4.000 m², com 6.300 m² de área de
  construção e 134 vagas de estacionamento.


  Localizado no ponto mais nobre e dinâmico de Uberlândia, o empreendimento nasce para se tornar
  um novo hub de conveniência, serviços e gastronomia, combinando arquitetura eficiente, alta
  visibilidade e performance comercial superior.
