copy: >-
  Com 53.000 m² de ABL, 190 lojas e um terreno de 130.000 m², o Uberlândia Shopping é um dos
  principais destinos de compras e serviços da região.


  A Nexa foi contratada para criar um HUB de serviços dentro do empreendimento, voltado para
  serviços, office, consultórios, clínicas, coworking e ensino, ampliando a vocação do shopping
  para além do varejo e gerando fluxo qualificado todos os dias.


  São 3.000 m² dedicados a serviços que vivem de recorrência, o tipo de operação que traz a
  mesma pessoa de volta várias vezes por mês.
